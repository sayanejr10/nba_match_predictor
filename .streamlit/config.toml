[theme]
base = "light"
primaryColor = "#1E40AF"
backgroundColor = "#F8FAFC"
secondaryBackgroundColor = "#F1F5F9"
textColor = "#0F172A"

[client]
# Les visiteurs ne voient jamais le détail technique d'une erreur
showErrorDetails = "none"
# Menu en haut à droite réduit au strict minimum pour les visiteurs
toolbarMode = "viewer"

[browser]
gatherUsageStats = false

[server]
# Sert le dossier static/ (les joueurs 3D de l'intro) à l'adresse /app/static/
enableStaticServing = true